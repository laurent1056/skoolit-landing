<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://getskoolit.com/prototype/" />
<title>Skoolit — Prototype</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1B241F; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         display: flex; align-items: center; justify-content: center; min-height: 100vh; }

  .card { background: #fff; border-radius: 12px; padding: 32px 28px; width: 100%; max-width: 360px; }

  .card input {
    display: block; width: 100%; padding: 10px 12px; margin-bottom: 10px;
    border: 1.5px solid #DAD4C8; border-radius: 8px;
    font-size: 15px; color: #1B241F; background: #F6F3EC; outline: none;
  }
  .card input:focus { border-color: #8AC2E5; background: #fff; }

  .card button.primary {
    display: block; width: 100%; padding: 11px;
    background: #8AC2E5; color: #1B241F; border: none; border-radius: 8px;
    font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 8px;
  }
  .card button.primary:disabled { opacity: .5; cursor: default; }

  .card button.link {
    background: none; border: none; color: #3076A8; font-size: 13px;
    cursor: pointer; text-decoration: underline; padding: 0;
  }

  .error   { font-size: 13px; color: #C8472E; margin-bottom: 8px; display: none; }
  .success { font-size: 13px; color: #2a7a4f; margin-bottom: 8px; display: none; }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%,60%  { transform: translateX(-6px); }
    40%,80%  { transform: translateX(6px); }
  }
  .shake { animation: shake .35s ease; }

  #state-req { display: none; }

  iframe { display: none; position: fixed; inset: 0; width: 100%; height: 100%; border: none; }
  #gate  { display: flex; align-items: center; justify-content: center;
           position: fixed; inset: 0; background: #1B241F; }
</style>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-G06C694J1V"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-G06C694J1V');
  </script>
</head>
<body>

<div id="gate">
  <div class="card">

    <div id="state-pw">
      <input id="pw" type="password" placeholder="Password" autocomplete="off" />
      <button class="primary" onclick="checkPw()">Enter prototype</button>
      <div class="error" id="pw-err">Incorrect password. Try again.</div>
      <button class="link" onclick="show('req')">Don't have a password? Request access →</button>
    </div>

    <div id="state-req">
      <input id="req-name"  type="text"  placeholder="Your name" />
      <input id="req-email" type="email" placeholder="Email address" />
      <input id="req-phone" type="tel"   placeholder="Phone (optional)" />
      <button class="primary" id="req-btn" onclick="requestAccess()">Request access</button>
      <div class="error"   id="req-err"></div>
      <div class="success" id="req-ok">Thanks — we'll be in touch soon.</div>
      <button class="link" onclick="show('pw')">← Back</button>
    </div>

  </div>
</div>

<iframe id="frame" src="app.html" title="Skoolit Prototype"></iframe>

<script>
(function () {
  var KEY = 'skoolit_proto';
  var PW  = btoa('skoolit2026');

  function unlock() {
    sessionStorage.setItem(KEY, '1');
    document.getElementById('gate').style.display  = 'none';
    document.getElementById('frame').style.display = 'block';
  }

  if (sessionStorage.getItem(KEY) === '1') unlock();

  window.show = function (state) {
    document.getElementById('state-pw').style.display  = state === 'pw'  ? 'block' : 'none';
    document.getElementById('state-req').style.display = state === 'req' ? 'block' : 'none';
  };

  window.checkPw = function () {
    var input = document.getElementById('pw');
    var err   = document.getElementById('pw-err');
    if (btoa(input.value) === PW) {
      unlock();
    } else {
      err.style.display = 'block';
      input.classList.remove('shake');
      void input.offsetWidth;
      input.classList.add('shake');
      input.value = '';
    }
  };

  window.requestAccess = function () {
    var name  = document.getElementById('req-name').value.trim();
    var email = document.getElementById('req-email').value.trim();
    var phone = document.getElementById('req-phone').value.trim();
    var err   = document.getElementById('req-err');
    var ok    = document.getElementById('req-ok');
    var btn   = document.getElementById('req-btn');

    err.style.display = 'none';
    ok.style.display  = 'none';

    if (!name)  { err.textContent = 'Please enter your name.'; err.style.display = 'block'; return; }
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      err.textContent = 'Please enter a valid email.'; err.style.display = 'block'; return;
    }

    btn.disabled = true; btn.textContent = 'Sending…';

    fetch('/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, email: email, phone: phone, source: 'prototype-gate' })
    })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.success) {
        ok.style.display  = 'block';
        btn.style.display = 'none';
        document.getElementById('req-name').disabled  = true;
        document.getElementById('req-email').disabled = true;
        document.getElementById('req-phone').disabled = true;
      } else { throw new Error(d.error || 'Something went wrong.'); }
    })
    .catch(function (e) {
      err.textContent = e.message; err.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Request access';
    });
  };

  document.getElementById('pw').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') checkPw();
  });
})();
</script>
</body>
</html>
