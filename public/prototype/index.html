<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skoolit — Prototype</title>
<style>
/* ============================================================
   FONTS
   ============================================================ */
@font-face {
  font-family: "Bricolage Grotesque";
  src: url("fonts/BricolageGrotesque.woff2") format("woff2");
  font-weight: 200 800;
  font-display: swap;
}
@font-face {
  font-family: "Hanken Grotesk";
  src: url("fonts/HankenGrotesk.woff2") format("woff2");
  font-weight: 100 900;
  font-display: swap;
}
@font-face {
  font-family: "JetBrains Mono";
  src: url("fonts/JetBrainsMono.woff2") format("woff2");
  font-weight: 100 800;
  font-display: swap;
}

/* ============================================================
   DESIGN TOKENS (from colors_and_type.css)
   ============================================================ */
:root {
  --paper:        #F6F3EC;
  --paper-sunk:   #EFEBE1;
  --surface:      #FFFFFF;
  --surface-2:    #FBF9F4;
  --ink-900:      #1B241F;
  --ink-700:      #3A453E;
  --ink-500:      #5E6862;
  --ink-400:      #828B85;
  --ink-300:      #AEB4AE;
  --line-strong:  #DAD4C8;
  --line:         #E6E1D6;
  --line-soft:    #EFEBE1;
  --spruce-900:   #5A0A1E;
  --spruce-700:   #AA1A40;
  --spruce-600:   #EA4073;
  --spruce-500:   #EE6090;
  --spruce-300:   #F5AABF;
  --spruce-100:   #FDDCE8;
  --spruce-050:   #FEF0F5;
  --honey-600:    #3076A8;
  --honey-500:    #8AC2E5;
  --honey-100:    #C8E4F4;
  --honey-050:    #E8F4FB;
  --red-600:      #B23A24;
  --red-500:      #C8472E;
  --red-100:      #F8E1DA;
  --red-050:      #FBEDE8;
  --amber-600:    #B87E0A;
  --amber-500:    #EAB42E;
  --amber-100:    #FBF0CC;
  --amber-050:    #FEF8E8;
  --grey-500:     #9A9F98;
  --grey-100:     #ECE9E1;
  --green-600:    #237A52;
  --green-100:    #D7EDDF;

  --bg:               var(--paper);
  --bg-sunk:          var(--paper-sunk);
  --card:             var(--surface);
  --card-alt:         var(--surface-2);
  --fg1:              var(--ink-900);
  --fg2:              var(--ink-500);
  --fg3:              var(--ink-400);
  --fg-disabled:      var(--ink-300);
  --fg-on-brand:      #FFFFFF;
  --fg-on-honey:      #14416B;
  --brand:            var(--spruce-600);
  --brand-strong:     var(--spruce-700);
  --brand-press:      var(--spruce-900);
  --brand-tint:       var(--spruce-100);
  --brand-tint-soft:  var(--spruce-050);
  --accent:           var(--honey-500);
  --accent-strong:    var(--honey-600);
  --accent-tint:      var(--honey-100);
  --border:           var(--line-strong);
  --border-soft:      var(--line);
  --hairline:         var(--line-soft);
  --urgent:           var(--red-500);
  --urgent-fg:        var(--red-600);
  --urgent-tint:      var(--red-050);
  --soon:             var(--amber-500);
  --soon-fg:          var(--amber-600);
  --soon-tint:        var(--amber-050);
  --info:             var(--grey-500);
  --success:          var(--green-600);
  --success-tint:     var(--green-100);
  --review:           var(--honey-500);
  --review-tint:      var(--honey-050);
  --focus:            var(--spruce-500);
  --focus-ring:       0 0 0 3px color-mix(in srgb, var(--spruce-500) 35%, transparent);

  --child-1:        #2C66C9;  --child-1-tint: #E2ECFB;
  --child-2:        #C24A2E;  --child-2-tint: #FAE5DD;
  --child-3:        #0E857C;  --child-3-tint: #D8F0ED;
  --child-4:        #7A45C9;  --child-4-tint: #ECE3FA;
  --child-5:        #B23A78;  --child-5-tint: #FAE2EF;
  --child-6:        #8A6A12;  --child-6-tint: #F6EDD0;
  --child-7:        #3F7E33;  --child-7-tint: #E2F0DC;
  --child-8:        #4A5A66;  --child-8-tint: #E6EBEF;

  --font-display: "Bricolage Grotesque", system-ui, sans-serif;
  --font-text:    "Hanken Grotesk", system-ui, sans-serif;
  --font-mono:    "JetBrains Mono", ui-monospace, monospace;

  --w-regular: 400;
  --w-medium:  500;
  --w-semibold:600;
  --w-bold:    700;
  --w-display: 800;

  --t-display: 2.5rem;
  --t-h1:      1.875rem;
  --t-h2:      1.375rem;
  --t-h3:      1.125rem;
  --t-body:    1rem;
  --t-body-sm: 0.9375rem;
  --t-label:   0.8125rem;
  --t-meta:    0.75rem;

  --lh-tight:   1.12;
  --lh-snug:    1.28;
  --lh-normal:  1.5;
  --lh-relaxed: 1.62;

  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.25rem;
  --space-6: 1.5rem;
  --space-8: 2rem;

  --radius-xs:  6px;
  --radius-sm:  10px;
  --radius-md:  14px;
  --radius-lg:  18px;
  --radius-xl:  24px;
  --radius-pill:999px;

  --shadow-xs: 0 1px 2px rgba(27,36,31,.05);
  --shadow-sm: 0 1px 2px rgba(27,36,31,.05), 0 2px 6px rgba(27,36,31,.05);
  --shadow-md: 0 2px 4px rgba(27,36,31,.05), 0 8px 20px rgba(27,36,31,.07);
  --shadow-lg: 0 6px 16px rgba(27,36,31,.08), 0 24px 48px rgba(27,36,31,.12);

  --ease-out:    cubic-bezier(0.22, 0.61, 0.36, 1);
  --ease-in-out: cubic-bezier(0.45, 0.05, 0.25, 1);
  --dur-fast: 120ms;
  --dur-base: 200ms;
  --dur-slow: 320ms;

  --app-max: 420px;
  --tap-min: 44px;
}

/* ============================================================
   BASE
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: #E9E4DA;
  font-family: var(--font-text);
  font-size: 16px;
  color: var(--fg1);
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  padding: 32px 16px 48px;
  -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

/* ============================================================
   PHONE SHELL
   ============================================================ */
.phone {
  width: 390px;
  height: 844px;
  background: var(--paper);
  border-radius: 50px;
  box-shadow: 0 2px 8px rgba(27,36,31,.14), 0 32px 80px rgba(27,36,31,.32);
  position: relative;
  overflow: hidden;
  border: 10px solid #13110E;
  display: flex;
  flex-direction: column;
  flex: none;
}

/* ============================================================
   STATUS BAR
   ============================================================ */
.statusbar {
  height: 50px;
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 26px 0 30px;
  font-size: 13px;
  font-weight: 600;
  color: var(--fg1);
  position: relative;
  z-index: 5;
}
.statusbar .notch {
  position: absolute;
  top: 10px; left: 50%;
  transform: translateX(-50%);
  width: 110px; height: 28px;
  background: #13110E;
  border-radius: 999px;
}
.statusbar .si { display: flex; gap: 5px; align-items: center; }
.statusbar .si svg { width: 14px; height: 14px; }

/* ============================================================
   BROWSER CHROME (PWA entry — landing shown in mobile browser)
   ============================================================ */
.browser-bar {
  flex: none;
  display: flex; align-items: center; gap: 10px;
  padding: 4px 14px 10px;
  background: var(--paper-sunk);
  border-bottom: 1px solid var(--hairline);
}
.browser-bar .bb-nav { color: var(--fg2); flex: none; }
.browser-bar .bb-dim { color: var(--fg3); opacity: .5; }
.browser-bar .bb-url {
  flex: 1; min-width: 0;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--surface); border: 1px solid var(--border-soft);
  border-radius: 999px; padding: 7px 14px;
  font-size: 13px; font-weight: 500; color: var(--fg2);
}
.browser-bar .bb-url svg { color: var(--success); flex: none; }
.browser-bar .bb-url span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* PWA install banner */
.install-banner {
  display: flex; align-items: center; gap: 12px;
  background: var(--surface); border: 1px solid var(--border-soft);
  border-radius: var(--radius-md); padding: 11px 12px; box-shadow: var(--shadow-sm);
  margin-bottom: 4px;
}
.install-banner img { width: 34px; height: 34px; flex: none; }
.install-banner .ib-text { flex: 1; min-width: 0; text-align: left; }
.install-banner .ib-title { font-size: 14px; font-weight: 600; color: var(--fg1); }
.install-banner .ib-sub { font-size: 12px; color: var(--fg3); margin-top: 1px; }
.install-banner .ib-add {
  flex: none; font-family: var(--font-text); font-size: 13px; font-weight: 600;
  color: var(--brand-strong); background: var(--brand-tint-soft);
  border: 1px solid transparent; border-radius: 999px; padding: 7px 16px; cursor: pointer;
}
.install-banner .ib-add:hover { background: var(--brand-tint); }

/* ============================================================
   SCREEN SCROLL AREA
   ============================================================ */
.screen {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  position: relative;
  scroll-behavior: smooth;
}
.screen::-webkit-scrollbar { width: 0; }

/* ============================================================
   APP HEADER
   ============================================================ */
.appheader {
  position: sticky; top: 0; z-index: 10;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(12px);
  padding: 10px 18px 12px;
  border-bottom: 1px solid var(--hairline);
}
.appheader-row { display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 9px; text-decoration: none; }
.brand img { width: 28px; height: 28px; }
.brand-name {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 22px;
  letter-spacing: -.03em;
  color: #8AC2E5;
}
.iconbtn {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: none;
  background: transparent;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--fg1);
  position: relative;
  transition: background var(--dur-fast);
}
.iconbtn:hover { background: var(--paper-sunk); }
.iconbtn svg { width: 20px; height: 20px; }
.ping {
  position: absolute; top: 9px; right: 9px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--urgent);
  border: 2px solid var(--paper);
}

/* Filter chips */
.filters {
  display: flex; gap: 7px;
  margin-top: 11px;
  overflow-x: auto;
  padding-bottom: 2px;
}
.filters::-webkit-scrollbar { height: 0; }
.fchip {
  flex: none;
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-text);
  font-size: 13px; font-weight: 600;
  padding: 7px 12px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--fg2);
  cursor: pointer;
  white-space: nowrap;
  transition: background var(--dur-fast), color var(--dur-fast), border-color var(--dur-fast);
}
.fchip .cdot { width: 7px; height: 7px; border-radius: 50%; }
.fchip.active { background: var(--ink-900); color: var(--paper); border-color: var(--ink-900); }

/* ============================================================
   DIGEST
   ============================================================ */
.digest { padding: 18px 16px 130px; display: flex; flex-direction: column; gap: 24px; }
.section-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.section-label {
  font-size: 11px; font-weight: 700;
  letter-spacing: .06em; text-transform: uppercase;
  color: var(--fg3);
}
.section-count {
  font-family: var(--font-mono);
  font-size: 11px; color: var(--fg3);
}
.stack { display: flex; flex-direction: column; gap: 10px; }

/* ============================================================
   ITEM CARD
   ============================================================ */
.card {
  position: relative;
  background: var(--card);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-lg);
  padding: 14px 15px 13px;
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  transition: box-shadow var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out);
  cursor: pointer;
}
.card:hover { box-shadow: var(--shadow-md); }
.card:active { transform: translateY(1px); }

/* Urgency left border */
.card[data-urg]::before {
  content: "";
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 5px;
}
.card[data-urg="urgent"]::before { background: var(--urgent); }
.card[data-urg="soon"]::before   { background: var(--soon); }
.card[data-urg="info"]::before   { background: var(--info); }

.card-top {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; margin-bottom: 8px;
}
.src {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--fg3); font-weight: 600;
  min-width: 0; flex: 1;
}
.src svg { width: 13px; height: 13px; flex: none; }
.src span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tags { display: flex; align-items: center; gap: 6px; flex: none; }

.badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 600;
  padding: 3px 8px; border-radius: 999px;
  white-space: nowrap;
}
.badge svg { width: 11px; height: 11px; }
.badge.urgent   { background: var(--red-100);     color: var(--red-600); }
.badge.soon     { background: var(--amber-100);   color: var(--amber-600); }
.badge.changed  { background: var(--brand-tint);  color: var(--brand-strong); }
.badge.added    { background: var(--success-tint);color: var(--success); }
.badge.updated  { background: var(--paper-sunk);  color: var(--fg2); }

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12px; font-weight: 600;
  padding: 3px 8px; border-radius: 999px;
  white-space: nowrap;
}
.chip .cdot { width: 7px; height: 7px; border-radius: 50%; }

.card h3 { font-size: 15px; font-weight: 600; color: var(--fg1); line-height: 1.35; }
.card .summary { font-size: 13.5px; color: var(--fg2); line-height: 1.5; margin-top: 4px; }

.diff {
  display: flex; align-items: center; gap: 6px;
  margin-top: 8px;
  font-family: var(--font-mono); font-size: 12px;
}
.diff .old { color: var(--fg3); text-decoration: line-through; }
.diff .new { color: var(--fg1); font-weight: 600; }
.diff svg  { width: 12px; height: 12px; color: var(--fg3); }

.actions { display: flex; gap: 7px; margin-top: 12px; }

/* ============================================================
   BUTTONS
   ============================================================ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font-family: var(--font-text);
  font-weight: 600; font-size: 13.5px;
  border-radius: var(--radius-sm);
  padding: 9px 13px;
  border: 1px solid transparent;
  cursor: pointer;
  min-height: 42px;
  white-space: nowrap;
  transition: background var(--dur-fast), box-shadow var(--dur-fast);
  text-align: center;
}
.btn svg { width: 14px; height: 14px; }
.btn.block { flex: 1; }
.btn-primary { background: var(--brand); color: var(--fg-on-brand); }
.btn-primary:hover { background: var(--brand-strong); }
.btn-primary:active { background: var(--brand-press); }
.btn-secondary { background: var(--surface); color: var(--fg1); border-color: var(--border); }
.btn-secondary:hover { background: var(--surface-2); }
.btn-ghost { background: transparent; color: var(--brand-strong); border: none; }
.btn-ghost:hover { background: var(--brand-tint-soft); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* Onboarding — multi-account pickers */
.acct-label { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--fg3); margin-bottom: -2px; }
.text-add-btn {
  background: none; border: none; font-family: var(--font-text); font-size: 13px;
  font-weight: 600; color: var(--brand-strong); cursor: pointer; text-align: left;
  padding: 4px 0; align-self: flex-start;
}
.text-add-btn:hover { text-decoration: underline; }
.future-callout {
  display: flex; gap: 11px; align-items: flex-start;
  background: var(--brand-tint-soft); color: var(--brand-strong);
  border-radius: var(--radius-md); padding: 12px 14px; font-size: 13px; line-height: 1.5;
}
.future-callout svg { flex: none; margin-top: 1px; }

/* ============================================================
   NEEDS REVIEW CARD
   ============================================================ */
.card.review {
  border: 1.5px dashed var(--accent);
  background: var(--review-tint);
  box-shadow: none;
}
.rlabel {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 700;
  letter-spacing: .04em; text-transform: uppercase;
  color: var(--accent-strong);
  margin-bottom: 6px;
}
.rlabel svg { width: 12px; height: 12px; }

/* ============================================================
   ASK-TO-CREATE CARD
   ============================================================ */
.propose {
  background: var(--card);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-lg);
  padding: 14px 15px 13px;
  box-shadow: var(--shadow-sm);
}
.propose-title {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 600; color: var(--fg3);
  margin-bottom: 10px;
}
.propose-title svg { width: 13px; height: 13px; color: var(--accent-strong); }
.evrow {
  display: flex; gap: 10px; align-items: flex-start;
  background: var(--brand-tint-soft);
  border-radius: var(--radius-md);
  padding: 10px 11px;
}
.calchip {
  flex: none; width: 44px; text-align: center;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px; overflow: hidden;
}
.calchip .cm { font-size: 9px; font-weight: 700; letter-spacing: .05em; background: var(--brand); color: #fff; padding: 2px 0; text-transform: uppercase; }
.calchip .cd { font-size: 19px; font-weight: 700; color: var(--fg1); padding: 2px 0; font-family: var(--font-display); }
.ev-meta { font-family: var(--font-mono); font-size: 12px; color: var(--fg2); }

/* ============================================================
   ALL CLEAR EMPTY STATE
   ============================================================ */
.allclear {
  display: flex; flex-direction: column; align-items: center;
  text-align: center;
  padding: 72px 32px 40px;
}
.allclear .glyph {
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--brand-tint);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 18px;
}
.allclear .glyph svg { width: 26px; height: 26px; color: var(--brand); }
.allclear h2 {
  font-family: var(--font-display); font-weight: 700; font-size: 22px;
  color: var(--fg1); margin-bottom: 8px;
}
.allclear p { font-size: 14px; color: var(--fg2); line-height: 1.5; max-width: 240px; }

/* ============================================================
   UNDO TOAST
   ============================================================ */
.toast {
  position: absolute; left: 14px; right: 14px; bottom: 96px; z-index: 20;
  background: var(--ink-900); color: var(--paper);
  border-radius: var(--radius-md);
  padding: 13px 14px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: var(--shadow-lg);
  animation: toastIn var(--dur-base) var(--ease-out);
}
.toast-msg { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 500; }
.toast-msg svg { width: 15px; height: 15px; color: var(--spruce-300); }
.toast button { background: transparent; border: none; color: var(--honey-500); font-weight: 700; font-size: 13.5px; cursor: pointer; font-family: var(--font-text); flex: none; }
@keyframes toastIn { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* ============================================================
   BOTTOM NAV
   ============================================================ */
.bottomnav {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-around;
  padding: 10px 20px 18px;
  background: color-mix(in srgb, var(--paper) 90%, transparent);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--hairline);
}
.navitem {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: transparent; border: none; cursor: pointer;
  color: var(--fg3); font-size: 11px; font-weight: 600;
  padding: 5px 12px; border-radius: var(--radius-md);
  font-family: var(--font-text);
  transition: color var(--dur-fast);
}
.navitem svg { width: 22px; height: 22px; }
.navitem.active { color: var(--brand-strong); }
.navitem.home-pill {
  background: var(--brand); color: var(--fg-on-brand);
  padding: 10px 22px; border-radius: 999px;
  margin-top: -4px;
}
.navitem.home-pill svg { width: 20px; height: 20px; }

/* ============================================================
   SUBSCREEN HEADER
   ============================================================ */
.subhead {
  position: sticky; top: 0; z-index: 10;
  background: color-mix(in srgb, var(--paper) 90%, transparent);
  backdrop-filter: blur(10px);
  padding: 14px 18px 12px;
  border-bottom: 1px solid var(--hairline);
  display: flex; align-items: center; gap: 12px;
}
.subhead h1 { font-family: var(--font-display); font-weight: 700; font-size: 22px; }
.pad { padding: 16px 16px 130px; }

/* ============================================================
   DETAIL SHEET
   ============================================================ */
.sheet-scrim {
  position: absolute; inset: 0; z-index: 30;
  background: rgba(27,36,31,.44);
  display: flex; align-items: flex-end;
  animation: fadeIn var(--dur-base) var(--ease-out);
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.sheet {
  width: 100%;
  background: var(--paper);
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  max-height: 90%;
  overflow-y: auto;
  padding: 8px 18px 30px;
  box-shadow: var(--shadow-lg);
  animation: sheetIn var(--dur-slow) var(--ease-out);
}
@keyframes sheetIn { from { transform: translateY(100%); } to { transform: translateY(0); } }
.grabber {
  width: 36px; height: 4px; border-radius: 999px;
  background: var(--line-strong); margin: 8px auto 16px;
}
.email-view {
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-md);
  padding: 14px; margin-top: 14px;
}
.email-from { font-size: 12.5px; color: var(--fg2); margin-bottom: 4px; display: flex; align-items: center; gap: 5px; }
.email-from svg { width: 13px; height: 13px; }
.email-subject { font-size: 14.5px; font-weight: 600; margin-bottom: 10px; }
.email-body { font-size: 13.5px; color: var(--fg2); line-height: 1.6; }
.email-body mark { background: var(--honey-100); color: var(--fg1); padding: 0 2px; border-radius: 3px; }
.transparency-note {
  font-size: 12px; color: var(--fg3); margin-top: 12px;
  display: flex; align-items: center; gap: 5px;
}
.transparency-note svg { width: 12px; height: 12px; }

/* ============================================================
   CALENDAR VIEW
   ============================================================ */
.cal-controls {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.cal-month { font-family: var(--font-display); font-weight: 700; font-size: 18px; }
.cal-toggle { display: flex; gap: 4px; }
.cal-toggle button {
  font-family: var(--font-text); font-size: 12.5px; font-weight: 600;
  padding: 6px 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--surface); color: var(--fg2);
  cursor: pointer;
}
.cal-toggle button.active { background: var(--ink-900); color: var(--paper); border-color: var(--ink-900); }

.cal-grid { width: 100%; border-collapse: collapse; table-layout: fixed; }
.cal-dow { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--fg3); padding: 0 0 8px; text-align: center; }
.cal-cell { padding: 4px 2px; vertical-align: top; width: 14.28%; }
.day-num {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 500; color: var(--fg2);
  margin: 0 auto 3px;
}
.day-num.today { background: var(--brand); color: var(--fg-on-brand); font-weight: 700; }
.day-num.other-month { color: var(--fg-disabled); }
.ev-chip {
  display: block; width: 100%;
  font-size: 9px; font-weight: 600;
  padding: 2px 3px; border-radius: 3px; margin-bottom: 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  line-height: 1.4;
}
.ev-chip.skoolit { font-style: italic; }

/* ============================================================
   SOURCES VIEW
   ============================================================ */
.src-suggest-head {
  display: flex; align-items: center; justify-content: space-between; padding: 0 4px;
}
.src-suggest-head > div:first-child {
  display: flex; align-items: center; gap: 7px;
  font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  color: var(--brand-strong);
}
.src-pulse {
  width: 8px; height: 8px; border-radius: 50%; background: var(--brand); flex-shrink: 0;
  animation: pulse-ring 2s ease-in-out infinite;
}
@keyframes pulse-ring {
  0%, 100% { box-shadow: 0 0 0 0 oklch(from var(--brand) l c h / .5); }
  50%       { box-shadow: 0 0 0 5px oklch(from var(--brand) l c h / 0); }
}
.src-badge {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; height: 18px; padding: 0 5px;
  background: var(--brand); color: var(--fg-on-brand);
  border-radius: 999px; font-size: 11px; font-weight: 700;
}
.src-suggest-card {
  padding: 13px 13px 11px;
  display: flex; flex-direction: column; gap: 10px;
}
.src-suggest-icon {
  width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.src-suggest-actions { display: flex; gap: 8px; }
.sp-group-row {
  display: flex; align-items: center; justify-content: space-between; padding: 0 4px;
}
.src-add-btn {
  display: flex; align-items: center; gap: 5px;
  font-family: var(--font-text); font-size: 12.5px; font-weight: 600;
  color: var(--brand); background: none; border: none; cursor: pointer; padding: 3px 0;
  transition: color var(--dur-fast);
}
.src-add-btn:hover { color: var(--brand-strong); }
.src-type-icon {
  width: 34px; height: 34px; border-radius: 8px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.src-type-pill {
  display: inline-flex; align-items: center;
  background: var(--surface-2); border: 1px solid var(--border-soft);
  border-radius: 999px; padding: 2px 7px;
  font-size: 11px; font-weight: 600; color: var(--fg3);
}
.src-remove-btn {
  width: 26px; height: 26px; border-radius: 50%;
  background: none; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--fg3); flex-shrink: 0;
  transition: background var(--dur-fast), color var(--dur-fast);
}
.src-remove-btn:hover { background: var(--red-050); color: var(--red-600); }
.src-type-tab {
  flex: 1; padding: 7px 4px; border-radius: var(--radius-sm);
  font-family: var(--font-text); font-size: 12px; font-weight: 600;
  background: var(--surface); border: 1px solid var(--border-soft);
  color: var(--fg2); cursor: pointer; transition: all var(--dur-fast);
}
.src-type-tab.active {
  background: var(--brand-tint); border-color: var(--brand); color: var(--brand-strong);
}
.src-empty {
  padding: 18px 16px; text-align: center;
  color: var(--fg3); font-size: 13px; font-style: italic;
}
.src-scan-strip {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  background: var(--brand-tint-soft); border: 1px solid var(--spruce-100);
  border-radius: var(--radius-md);
  font-size: 12.5px; color: var(--fg2);
}
.src-scan-strip strong { color: var(--fg1); font-weight: 700; }

/* ============================================================
   SETTINGS VIEW
   ============================================================ */
.settings-section { margin-bottom: 28px; }
.settings-section-title {
  font-size: 11px; font-weight: 700;
  letter-spacing: .06em; text-transform: uppercase;
  color: var(--fg3); margin-bottom: 8px; padding: 0 4px;
}
.settings-list { background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--border-soft); overflow: hidden; }
.settings-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; cursor: pointer;
  border-bottom: 1px solid var(--hairline);
  transition: background var(--dur-fast);
}
.settings-row:last-child { border-bottom: none; }
.settings-row:hover { background: var(--surface-2); }
.settings-row-left { display: flex; align-items: center; gap: 12px; }
.settings-icon {
  width: 34px; height: 34px; border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
}
.settings-icon svg { width: 17px; height: 17px; }
.settings-row-label { font-size: 15px; font-weight: 500; color: var(--fg1); }
.settings-row-meta { font-size: 12.5px; color: var(--fg3); margin-top: 1px; }
.settings-row-chevron svg { width: 16px; height: 16px; color: var(--fg3); }

/* ============================================================
   ONBOARDING WIZARD
   ============================================================ */
.ob-wrap {
  width: 390px;
  height: 844px;
  background: var(--paper);
  border-radius: 50px;
  box-shadow: 0 2px 8px rgba(27,36,31,.14), 0 32px 80px rgba(27,36,31,.32);
  position: relative;
  overflow: hidden;
  border: 10px solid #13110E;
  display: flex;
  flex-direction: column;
  flex: none;
}
.ob-statusbar {
  height: 50px; flex: none;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 26px 0 30px;
  font-size: 13px; font-weight: 600; color: var(--fg1);
  position: relative; z-index: 5;
}
.ob-statusbar .notch {
  position: absolute; top: 10px; left: 50%;
  transform: translateX(-50%);
  width: 110px; height: 28px;
  background: #13110E; border-radius: 999px;
}
.ob-inner {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  display: flex; flex-direction: column;
}
.ob-inner::-webkit-scrollbar { width: 0; }

/* Top bar: step X of 7 + back */
.ob-topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 20px 0;
}
.ob-back {
  display: flex; align-items: center; gap: 4px;
  font-size: 14px; font-weight: 600; color: var(--fg2);
  background: transparent; border: none; cursor: pointer;
  font-family: var(--font-text);
}
.ob-back svg { width: 16px; height: 16px; }
.ob-step-label { font-size: 13px; font-weight: 600; color: var(--fg3); }

/* Progress bar */
.ob-progress {
  height: 3px; background: var(--line);
  margin: 12px 20px 0; border-radius: 999px; overflow: hidden;
}
.ob-progress-fill {
  height: 100%; background: var(--brand); border-radius: 999px;
  transition: width var(--dur-slow) var(--ease-out);
}

/* Step content */
.ob-content { flex: 1; padding: 28px 24px 24px; display: flex; flex-direction: column; gap: 20px; }
.ob-eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--brand); }
.ob-title { font-family: var(--font-display); font-weight: 800; font-size: 26px; line-height: 1.15; letter-spacing: -.02em; color: var(--fg1); }
.ob-subtitle { font-size: 15px; color: var(--fg2); line-height: 1.55; }

/* Form elements */
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-label { font-size: 13px; font-weight: 600; color: var(--fg1); }
.form-hint { font-size: 12px; color: var(--fg3); }
.form-input {
  width: 100%; padding: 11px 14px;
  font-family: var(--font-text); font-size: 15px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface);
  color: var(--fg1);
  transition: border-color var(--dur-fast);
  outline: none;
}
.form-input:focus { border-color: var(--brand); }
.form-input::placeholder { color: var(--fg3); }

.form-row { display: flex; gap: 10px; }
.form-row .form-group { flex: 1; }

/* Provider buttons */
.provider-btn {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border-radius: var(--radius-md);
  border: 1.5px solid var(--border);
  background: var(--surface); cursor: pointer;
  transition: border-color var(--dur-fast), background var(--dur-fast);
  font-family: var(--font-text);
  width: 100%;
}
.provider-btn:hover { border-color: var(--brand); background: var(--brand-tint-soft); }
.provider-btn.selected { border-color: var(--brand); background: var(--brand-tint-soft); }
.provider-btn svg { width: 22px; height: 22px; color: var(--fg2); }
.provider-btn .pb-text { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; }
.provider-btn .pb-name { font-size: 15px; font-weight: 600; color: var(--fg1); }
.provider-btn .pb-desc { font-size: 12px; color: var(--fg3); }
.provider-btn .check { margin-left: auto; width: 20px; height: 20px; border-radius: 50%; background: var(--brand); display: flex; align-items: center; justify-content: center; }
.provider-btn .check svg { width: 12px; height: 12px; color: white; }

/* Event type rules (step 5) */
.event-rules { display: flex; flex-direction: column; gap: 8px; }
.event-rule-row {
  display: flex; align-items: center;
  background: var(--surface); border: 1px solid var(--border-soft);
  border-radius: var(--radius-md); padding: 10px 12px;
  gap: 10px;
}
.event-rule-name { flex: 1; font-size: 14px; font-weight: 500; color: var(--fg1); }
.rule-selector { display: flex; gap: 3px; }
.rule-btn {
  font-family: var(--font-text); font-size: 11px; font-weight: 600;
  padding: 5px 9px; border-radius: var(--radius-xs);
  border: 1px solid var(--border);
  background: var(--surface); color: var(--fg3);
  cursor: pointer; transition: all var(--dur-fast);
  white-space: nowrap;
}
.rule-btn.active-always { background: var(--success-tint); color: var(--success); border-color: var(--green-100); }
.rule-btn.active-ask    { background: var(--amber-100);    color: var(--amber-600); border-color: var(--amber-100); }
.rule-btn.active-never  { background: var(--grey-100);     color: var(--ink-500);   border-color: var(--grey-100); }

/* Bottom action area */
.ob-bottom { padding: 16px 24px 28px; flex: none; border-top: 1px solid var(--hairline); display: flex; flex-direction: column; gap: 10px; }
.ob-next {
  width: 100%; padding: 14px;
  font-family: var(--font-text); font-size: 16px; font-weight: 700;
  border-radius: var(--radius-md); border: none; cursor: pointer;
  background: var(--brand); color: var(--fg-on-brand);
  transition: background var(--dur-fast);
}
.ob-next:hover { background: var(--brand-strong); }
.ob-next:disabled { background: var(--fg-disabled); cursor: not-allowed; }
.ob-skip {
  background: transparent; border: none;
  font-family: var(--font-text); font-size: 14px; font-weight: 600;
  color: var(--fg3); cursor: pointer; text-align: center;
  padding: 4px; display: block; width: 100%;
}
.ob-skip:hover { color: var(--fg2); }

/* Connected confirmation */
.connected-box {
  background: var(--success-tint);
  border: 1.5px solid var(--green-100);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  display: flex; align-items: center; gap: 12px;
}
.connected-box svg { width: 18px; height: 18px; color: var(--success); flex: none; }
.connected-box .cb-text { font-size: 14px; font-weight: 500; color: var(--success); }
.connected-box .cb-sub { font-size: 12px; color: var(--fg2); margin-top: 2px; }

/* Completion screen */
.ob-complete {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  padding: 40px 24px 24px; text-align: center; gap: 24px;
}
.ob-complete-icon {
  width: 72px; height: 72px; border-radius: 50%;
  background: var(--brand-tint);
  display: flex; align-items: center; justify-content: center;
}
.ob-complete-icon svg { width: 36px; height: 36px; color: var(--brand); }
.ob-complete h1 {
  font-family: var(--font-display); font-weight: 800; font-size: 30px;
  line-height: 1.15; letter-spacing: -.02em; color: var(--fg1);
}
.ob-complete .sub { font-size: 16px; color: var(--fg2); line-height: 1.55; max-width: 280px; }
.watching-list {
  background: var(--surface); border: 1px solid var(--border-soft);
  border-radius: var(--radius-lg); padding: 16px 18px;
  width: 100%; text-align: left;
  display: flex; flex-direction: column; gap: 12px;
}
.watching-row { display: flex; align-items: flex-start; gap: 10px; }
.watching-row svg { width: 16px; height: 16px; color: var(--brand); margin-top: 1px; flex: none; }
.watching-row-text .wr-label { font-size: 14px; font-weight: 600; color: var(--fg1); }
.watching-row-text .wr-val { font-size: 13px; color: var(--fg2); margin-top: 2px; }

/* Prototype nav */
.proto-nav {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 8px; z-index: 100;
  background: rgba(20,17,14,.85); backdrop-filter: blur(8px);
  border-radius: 999px; padding: 8px 12px;
}
.proto-nav button {
  font-family: var(--font-text); font-size: 12px; font-weight: 600;
  padding: 6px 14px; border-radius: 999px; border: none; cursor: pointer;
  color: rgba(255,255,255,.6); background: transparent;
}
.proto-nav button.active { background: rgba(255,255,255,.15); color: white; }

/* ============================================================
   D-2 — CHILD FILTER FADE MASK (signals horizontal overflow)
   ============================================================ */
.filters-wrap { position: relative; }
.filters-wrap::after {
  content: ""; position: absolute; top: 0; bottom: 0; right: 0;
  width: 40px; pointer-events: none;
  background: linear-gradient(to right, transparent, var(--paper));
}

/* ============================================================
   D-11 — SETTINGS SUB-PAGES
   ============================================================ */
.subpage { padding: 16px 16px 130px; display: flex; flex-direction: column; gap: 22px; }
.sp-group { display: flex; flex-direction: column; gap: 8px; }
.sp-group-title {
  font-size: 11px; font-weight: 700; letter-spacing: .06em;
  text-transform: uppercase; color: var(--fg3); padding: 0 4px;
}
.sp-group-hint { font-size: 12.5px; color: var(--fg3); padding: 0 4px; line-height: 1.5; }
.sp-list {
  background: var(--surface); border: 1px solid var(--border-soft);
  border-radius: var(--radius-lg); overflow: hidden;
}
.sp-row {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 15px; border-bottom: 1px solid var(--hairline);
  min-height: var(--tap-min); width: 100%; background: none;
  border-left: none; border-right: none; border-top: none;
  font-family: var(--font-text); text-align: left; cursor: pointer;
  transition: background var(--dur-fast);
}
.sp-row:last-child { border-bottom: none; }
.sp-row.tappable:hover { background: var(--surface-2); }
.sp-row.static { cursor: default; }
.sp-row-main { flex: 1; min-width: 0; }
.sp-row-title { font-size: 15px; font-weight: 600; color: var(--fg1); }
.sp-row-meta { font-size: 12.5px; color: var(--fg3); margin-top: 2px; line-height: 1.4; }
.sp-cdot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.sp-chev svg { width: 16px; height: 16px; color: var(--fg3); }

/* Add row (dashed, brand) */
.sp-add {
  display: flex; align-items: center; gap: 9px;
  width: 100%; padding: 13px 15px; min-height: var(--tap-min);
  background: var(--surface); border: 1px dashed var(--border);
  border-radius: var(--radius-md); cursor: pointer;
  font-family: var(--font-text); font-size: 14px; font-weight: 600;
  color: var(--brand-strong); transition: background var(--dur-fast);
}
.sp-add:hover { background: var(--brand-tint-soft); }
.sp-add svg { width: 16px; height: 16px; }

/* Provider/status badges */
.status-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 700; padding: 3px 9px;
  border-radius: 999px; white-space: nowrap;
}
.status-badge svg { width: 11px; height: 11px; }
.status-badge.ok   { background: var(--success-tint); color: var(--success); }
.status-badge.warn { background: var(--red-050); color: var(--red-600); }
.provider-glyph {
  width: 36px; height: 36px; border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center; flex: none;
}
.provider-glyph svg { width: 18px; height: 18px; }

/* Field block (edit views) */
.sp-field { display: flex; flex-direction: column; gap: 6px; }
.sp-field-label { font-size: 13px; font-weight: 600; color: var(--fg1); }

/* Color picker — 8-dot grid (D-4) */
.swatch-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.swatch {
  width: 100%; aspect-ratio: 1; max-width: 56px; justify-self: center;
  border-radius: 50%; border: none; cursor: pointer; position: relative;
  display: flex; align-items: center; justify-content: center;
  transition: transform var(--dur-fast);
}
.swatch:hover { transform: scale(1.06); }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px currentColor; }
.swatch svg { width: 20px; height: 20px; color: #fff; }

/* Destructive row */
.sp-danger {
  width: 100%; padding: 13px 15px; min-height: var(--tap-min);
  background: var(--surface); border: 1px solid var(--border-soft);
  border-radius: var(--radius-md); cursor: pointer;
  font-family: var(--font-text); font-size: 14px; font-weight: 600;
  color: var(--red-600); text-align: left;
  display: flex; align-items: center; gap: 9px;
  transition: background var(--dur-fast);
}
.sp-danger:hover { background: var(--red-050); }
.sp-danger svg { width: 16px; height: 16px; }

/* Category pill (monitored senders) */
.cat-pill {
  font-size: 11px; font-weight: 600; padding: 2px 8px;
  border-radius: 999px; background: var(--paper-sunk); color: var(--fg2);
  white-space: nowrap;
}

/* ============================================================
   CONFIRMATION MODAL (destructive actions)
   ============================================================ */
.modal-scrim {
  position: absolute; inset: 0; z-index: 40;
  background: rgba(27,36,31,.44);
  display: flex; align-items: center; justify-content: center;
  padding: 26px; animation: fadeIn var(--dur-base) var(--ease-out);
}
.modal {
  background: var(--paper); border-radius: var(--radius-xl);
  padding: 22px 20px 18px; width: 100%; max-width: 320px;
  box-shadow: var(--shadow-lg); text-align: center;
  animation: modalIn var(--dur-base) var(--ease-out);
}
@keyframes modalIn { from { transform: scale(.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal-icon {
  width: 46px; height: 46px; border-radius: 50%; margin: 0 auto 12px;

.fb-pills { display: flex; gap: 8px; }
.fb-pill {
  flex: 1; font-family: var(--font-text); font-size: 13px; font-weight: 600;

  min-height: var(--tap-min); transition: all var(--dur-fast); text-align: center;
}
.fb-pill.sel-child  { background: var(--brand-tint);  color: var(--brand-strong); border-color: var(--brand-tint); }
.fb-pill.sel-date   { background: var(--amber-100);   color: var(--amber-600);    border-color: var(--amber-100); }
.fb-pill.sel-remove { background: var(--grey-100);    color: var(--ink-700);      border-color: var(--grey-100); }
.fb-sublabel { font-size: 13px; font-weight: 600; color: var(--fg1); margin: 18px 0 9px; }
.fb-textarea {
  width: 100%; padding: 11px 14px; font-family: var(--font-text); font-size: 14px;
  border: 1.5px solid var(--border); border-radius: var(--radius-md);
  background: var(--surface); color: var(--fg1); resize: none; min-height: 64px;
  outline: none; transition: border-color var(--dur-fast);
}
.fb-textarea:focus { border-color: var(--brand); }
.fb-childpick { display: flex; flex-wrap: wrap; gap: 8px; }

  background: var(--surface-2);
  border: 1px solid var(--border-soft);

}

.pd-eyebrow {
  display: inline-flex; align-items: center; gap: 5px;

}
.pd-eyebrow svg { width: 12px; height: 12px; }

.coparent-inner {
  flex: 1; display: flex; flex-direction: column; align-items: center;

}

  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 800; font-size: 30px;
  background: var(--brand-tint); color: var(--brand-strong);

.cp-card {

.fa-person {

  display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg3);

}
.fa-children-note .cdot { width: 8px; height: 8px; }

.fa-pending {
  display: flex; align-items: center; gap: 12px; padding: 13px 15px;
}
.fa-cancel {
  font-family: var(--font-text); font-size: 13px; font-weight: 600;

}

  font-family: var(--font-text); font-size: 13px; font-weight: 700;

.cp-banner {
  display: flex; align-items: center; gap: 12px;

}
.cp-banner-icon {
  width: 36px; height: 36px; border-radius: var(--radius-sm); flex: none;

.cp-banner-title { font-size: 14px; font-weight: 600; color: var(--fg1); }
.cp-banner-sub { font-size: 12px; color: var(--fg3); margin-top: 1px; }

.setup-card-dismiss {
  position: absolute; top: 9px; right: 9px;
  width: 24px; height: 24px; border-radius: 50%;
  border: none; background: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--fg3);
  transition: background var(--dur-fast);
}
.setup-card-dismiss:hover { background: var(--brand-tint); }
.setup-card-dismiss svg { width: 13px; height: 13px; }

/* Google OAuth button + OR divider */
.btn-google-oauth {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; padding: 13px 16px;
  font-family: var(--font-text); font-size: 15px; font-weight: 600;
  background: var(--brand); color: var(--fg-on-brand);
  border: none; border-radius: var(--radius-md); cursor: pointer;
  min-height: 50px;
  transition: background var(--dur-fast);
}
.btn-google-oauth:hover { background: var(--brand-strong); }
.btn-google-oauth:active { background: var(--brand-press); }
.or-divider {
  display: flex; align-items: center; gap: 12px;
  color: var(--fg3); font-size: 13px; font-weight: 500;
  user-select: none;
}
.or-divider::before, .or-divider::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}

/* ============================================================
   §4.12 — ADD CONTENT (email forwarding + document upload)
   ============================================================ */
.ac-upload-zone {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 28px 16px; width: 100%; cursor: pointer;
  border: 2px dashed var(--border);
  border-radius: var(--radius-lg);

.confidence-bar { height: 5px; background: var(--line); border-radius: 999px; overflow: hidden; margin: 14px 0; }

  display: flex; align-items: baseline; gap: 10px;
  padding: 9px 0; border-bottom: 1px solid var(--hairline);
}
.extract-row:last-child { border-bottom: none; }
.extract-label {
  font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  color: var(--fg3); min-width: 70px; flex: none;
}
.extract-value { font-size: 14px; color: var(--fg1); }

@keyframes spin { to { transform: rotate(360deg); } }

function applyTweaks(t) {
  const root = document.documentElement;
  const brandKey = (t.brand && t.brand[0]) || '#EA4073';

  const atm = ATMOS[t.atmosphere] || ATMOS.warm;

/* ============================================================
   ICON COMPONENT
   ============================================================ */
function Icon({ name, size = 16, style = {} }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.lucide) {
      ref.current.innerHTML = '';
      const el = document.createElement('i');
      el.setAttribute('data-lucide', name);
      ref.current.appendChild(el);
      try {
        window.lucide.createIcons({ nameAttr: 'data-lucide' });
      } catch (e) {}
    }
  }, [name]);
  return (
    <span ref={ref} style={{ display: 'inline-flex', width: size, height: size, flexShrink: 0, ...style }} />);

}

function DigestView({ filter, onOpen, handled, onResolve, onAdd, toast, onUndoToast, coParent, firstLogin = false, onGoToSources }) {
  const [collapsed, setCollapsed] = useState({ week: true, month: true });
  const [flagged, setFlagged] = useState(new Set());
  const [banners, setBanners] = useState({ calendar: true, inbox: true });
  const [feedbackItem, setFeedbackItem] = useState(null);
  const [dismissedCards, setDismissedCards] = useState(() => {
    try { return JSON.parse(localStorage.getItem('skoolit-setup-dismissed') || '{}'); }
    catch(e) { return {}; }
  });
  const dismissCard = (key) => {
    const next = { ...dismissedCards, [key]: true };
    setDismissedCards(next);
    try { localStorage.setItem('skoolit-setup-dismissed', JSON.stringify(next)); } catch(e) {}
  };
  const onFlag = (item) => setFeedbackItem(item);
  const onFeedbackDone = (item) => {
    setFlagged((prev) => new Set([...prev, item.id]));
    setFeedbackItem(null);
  };

  const visible = (id) => {
    if (handled.has(id)) return false;
    if (filter === 'all') return true;
    const item = DIGEST_ITEMS.find((d) => d.id === id);
    return item && item.childName.toLowerCase() === filter;
  };

  const sections = [
  { key: 'today', label: 'Today', sublabel: 'Mon, Jun 1', items: DIGEST_ITEMS.filter((d) => d.timeframe === 'today' && visible(d.id)) },
  { key: 'week', label: 'This week', sublabel: 'Jun 2 – Jun 7', items: DIGEST_ITEMS.filter((d) => d.timeframe === 'week' && visible(d.id)) },
  { key: 'month', label: 'This month', sublabel: 'June 2026', items: DIGEST_ITEMS.filter((d) => d.timeframe === 'month' && visible(d.id)) }].
  filter((s) => s.items.length > 0);

  const totalActions = (sections.find((s) => s.key === 'today') || { items: [] }).items.length;

  if (sections.length === 0) {
    return (
      <div className="digest">
        <div className="allclear">
          <div className="glyph"><Icon name="check" size={26} /></div>
          <h2>All clear for today.</h2>
          <p>Nothing needs your attention right now. Skoolit is still watching.</p>
        </div>
        {toast && <UndoToast msg={toast.msg} onUndo={toast.onUndo} onDismiss={onUndoToast} />}
      </div>);

  }

  return (
    <div className="digest">
      <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between' }}>
        <div>
          <div style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 20 }}>Monday, June 1</div>
          {totalActions > 0 &&
          <div style={{ fontSize: 13, color: 'var(--fg2)', marginTop: 3 }}>
              {totalActions} thing{totalActions !== 1 ? 's' : ''} need{totalActions === 1 ? 's' : ''} your attention today
            </div>
          }
        </div>
      </div>

      {firstLogin && (!dismissedCards.coparent || !dismissedCards.senders) && (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          {!dismissedCards.coparent && (
            <div className="setup-card">
              <button className="setup-card-dismiss" aria-label="Dismiss" onClick={() => dismissCard('coparent')}>

function CalendarView({ filter }) {
  // June 2026: starts on Monday (day 1 = Monday)
  // June 1, 2026 is a Monday
  const days = Array.from({ length: 30 }, (_, i) => i + 1);
  // Leading empty cells: June 1 is Monday = 0 offset (Monday = index 0)
  const leadingEmpty = 0;

  const eventsForDay = (day) => {
    return JUNE_EVENTS.filter((e) => {
      if (e.day !== day) return false;
      if (filter === 'all') return true;
      return e.child === filter;
    });
  };

  return (
    <div>
      <div className="subhead">
        <h1>Calendar</h1>
        <div style={{ marginLeft: 'auto', display: 'flex', gap: 5 }}>
          <button className="btn btn-secondary" style={{ padding: '6px 12px', fontSize: 12, minHeight: 0 }}>Week</button>
          <button className="btn btn-primary" style={{ padding: '6px 12px', fontSize: 12, minHeight: 0 }}>Month</button>
        </div>
      </div>
      <div className="pad" style={{ paddingTop: 16 }}>
        <div className="cal-controls">
          <span className="cal-month">June 2026</span>
          <div style={{ display: 'flex', gap: 6 }}>
            <button className="iconbtn" aria-label="Previous month" style={{ width: 32, height: 32 }}><Icon name="chevron-left" size={16} /></button>
            <button className="iconbtn" aria-label="Next month" style={{ width: 32, height: 32 }}><Icon name="chevron-right" size={16} /></button>
          </div>
        </div>

        <table className="cal-grid">
          <thead>
            <tr>
              {['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((d) =>
              <th key={d} className="cal-dow">{d}</th>
              )}
            </tr>
          </thead>
          <tbody>
            {(() => {
              const cells = [
              ...Array(leadingEmpty).fill(null),
              ...days];

              // Pad to full weeks
              while (cells.length % 7 !== 0) cells.push(null);
              const rows = [];
              for (let i = 0; i < cells.length; i += 7) {
                rows.push(cells.slice(i, i + 7));
              }
              return rows.map((row, ri) =>
              <tr key={ri}>
                  {row.map((day, ci) =>
                <td key={ci} className="cal-cell">
                      {day &&
                  <>
                          <div className={'day-num' + (day === 1 ? ' today' : '')}>{day}</div>
                          {eventsForDay(day).map((ev, ei) =>
                    <span
                      key={ei}
                      className={'ev-chip' + (ev.skoolit ? ' skoolit' : '')}
                      style={{ background: ev.tint, color: ev.color }}>
                      
                              {ev.skoolit ? '• ' : ''}{ev.label}
                            </span>
                    )}
                        </>
                  }
                    </td>
                )}
                </tr>
              );
            })()}
          </tbody>
        </table>

        <div style={{ marginTop: 20, display: 'flex', flexWrap: 'wrap', gap: 8 }}>
          {CHILDREN.map((c) =>
          <div key={c.id} style={{ display: 'flex', alignItems: 'center', gap: 5, fontSize: 12, color: 'var(--fg2)' }}>
              <span style={{ width: 8, height: 8, borderRadius: '50%', background: c.color, display: 'inline-block' }} />
              {c.name}
            </div>
          )}
          <div style={{ display: 'flex', alignItems: 'center', gap: 5, fontSize: 12, color: 'var(--fg3)', fontStyle: 'italic' }}>
            • = added by Skoolit
          </div>
        </div>
      </div>
    </div>);

}

                    <div className="fa-person-meta">On {s.appearances} of Emma's school emails</div>
                  </div>
                  <button className="fa-invite-btn" onClick={() => {sendInvite(s.email, s.name);setSuggestions((p) => p.filter((_, j) => j !== i));}}>Invite</button>
                </div>
            )}
            </div>
          </div>
        }

        {/* Invite by email */}
        {!coParent &&
        <div className="sp-group">
            <div className="sp-group-title">Invite a co-parent</div>
            <div className="sp-field">
              <input className="form-input" type="email" placeholder="Their email address" value={email}
            onChange={(e) => setEmail(e.target.value)} />
            </div>
            <button className="btn btn-primary block" disabled={!email.trim()}
          onClick={() => {sendInvite(email.trim());setEmail('');}}>
              <Icon name="send" size={14} />Send invite
            </button>
            <div className="sp-group-hint">They'll get a link to join Emma, Noah & Mia's family — they inherit all your setup and add nothing.</div>
          </div>
        }

        {coParent &&
        <div className="sp-group">
            <div className="future-callout" style={{ background: 'var(--paper-sunk)', color: 'var(--fg2)' }}>
              <Icon name="info" size={17} />
              <span>You're sharing {PRIMARY_PARENT.first}'s family. School connections, monitored senders, and child details are managed by {PRIMARY_PARENT.first}.</span>
            </div>
          </div>
        }
      </div>

      {cancelTarget !== null && pending[cancelTarget] &&
      <ConfirmModal
        title={`Cancel invite to ${pending[cancelTarget].first || pending[cancelTarget].name}?`}
        body="The invitation link will stop working immediately. You can always send a new one later."
        confirmLabel="Cancel invite"
        onConfirm={() => {setPending((p) => p.filter((_, j) => j !== cancelTarget));setCancelTarget(null);}}
        onCancel={() => setCancelTarget(null)} />
      }
    </div>);
}

function SourcesView({ onBack = null }) {
  const KIDS = [
    { name: 'Emma', ci: 0 },
    { name: 'Noah', ci: 1 },
    { name: 'Mia',  ci: 2 },
  ];

  const [scanState, setScanState] = useState('idle'); // idle | scanning | done
  const [suggestions, setSuggestions] = useState([
    { id: 's1', type: 'domain', value: 'lincolnpta.org',           label: 'Lincoln PTA',       child: 'Emma', ci: 0, count: 4  },
    { id: 's2', type: 'sender', value: 'coach.sarah@ymcasoccer.org', label: 'YMCA Soccer Coach', child: 'Noah', ci: 1, count: 2  },
    { id: 's3', type: 'domain', value: 'schoolmessenger.com',       label: 'School Messenger',  child: 'Emma', ci: 0, count: 11 },
  ]);
  const [approved, setApproved] = useState(new Set());
  const [skipped,  setSkipped]  = useState(new Set());

  const [domains, setDomains] = useState([
    { id: 'd1', value: 'riversidesoccer.org', label: 'Sport',  child: 'Noah', ci: 1 },
    { id: 'd2', value: 'lincolnms.edu',       label: 'School', child: 'Emma', ci: 0 },
  ]);
  const [senders, setSenders] = useState([
    { id: 'p1', value: 'coach.mike@gmail.com',  label: 'Soccer Coach', child: 'Noah', ci: 1 },
    { id: 'p2', value: 'mrjohnson@gmail.com',   label: 'Math Tutor',   child: 'Emma', ci: 0 },
  ]);

  const [sheet,         setSheet]         = useState(null); // null | add-domain | add-sender | remove-confirm
  const [removeTarget,  setRemoveTarget]  = useState(null);
  const [newDomain,     setNewDomain]     = useState('');
  const [newDomainType, setNewDomainType] = useState('School');
  const [newDomainChild,setNewDomainChild]= useState(null);
  const [newSender,     setNewSender]     = useState('');
  const [newSenderLabel,setNewSenderLabel]= useState('');
  const [newSenderChild,setNewSenderChild]= useState(null);

  const pending  = suggestions.filter(s => !approved.has(s.id) && !skipped.has(s.id));
  const nApproved = [...approved].length;

  const approveAndAdd = (s) => {
    const kid = KIDS.find(k => k.name === s.child);
    if (s.type === 'domain') setDomains(prev => [...prev, { id: 'd_'+s.id, value: s.value, label: s.label, child: s.child, ci: kid.ci }]);
    else setSenders(prev => [...prev, { id: 'p_'+s.id, value: s.value, label: s.label, child: s.child, ci: kid.ci }]);
    setApproved(prev => new Set([...prev, s.id]));
  };
  const skipSugg = (id) => setSkipped(prev => new Set([...prev, id]));

  const confirmRemove = (item, type) => { setRemoveTarget({ ...item, _type: type }); setSheet('remove-confirm'); };
  const doRemove = () => {
    if (removeTarget._type === 'domain') setDomains(prev => prev.filter(d => d.id !== removeTarget.id));
    else setSenders(prev => prev.filter(s => s.id !== removeTarget.id));
    setSheet(null); setRemoveTarget(null);
  };

  const addDomain = () => {
    if (!newDomain || !newDomainChild) return;
    const kid = KIDS.find(k => k.name === newDomainChild);
    setDomains(prev => [...prev, { id: 'd'+Date.now(), value: newDomain.toLowerCase().trim(), label: newDomainType, child: newDomainChild, ci: kid.ci }]);
    setNewDomain(''); setNewDomainType('School'); setNewDomainChild(null); setSheet(null);
  };
  const addSender = () => {
    if (!newSender || !newSenderChild) return;
    const kid = KIDS.find(k => k.name === newSenderChild);
    setSenders(prev => [...prev, { id: 'p'+Date.now(), value: newSender.toLowerCase().trim(), label: newSenderLabel || 'Sender', child: newSenderChild, ci: kid.ci }]);
    setNewSender(''); setNewSenderLabel(''); setNewSenderChild(null); setSheet(null);
  };

  const handleScan = () => {
    setScanState('scanning');
    setTimeout(() => {
      setSuggestions(prev => [...prev, { id: 's_new', type: 'sender', value: 'noreply@remind.com', label: 'Remind', child: 'Emma', ci: 0, count: 3 }]);
      setScanState('done');
    }, 2000);
  };

  return (
    <div>
      {onBack
        ? <SubPageHead title="Monitored senders &amp; domains" onBack={onBack} />
        : <div className="subhead"><h1>Sources</h1></div>
      }

      <div className="subpage" style={{ paddingTop: 12 }}>
        {/* ── Scan controls ─────────────────────────────── */}
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          <span style={{ fontSize: 11.5, color: 'var(--fg3)', display: 'flex', alignItems: 'center', gap: 5 }}>
            {scanState === 'scanning'
              ? <><Icon name="loader" size={13} style={{ animation: 'spin 1.2s linear infinite' }} />Scanning…</>
              : (scanState === 'done' ? 'Just now' : 'Last scanned today at 9:14\u202fAM')
            }
          </span>
          <button className="btn btn-secondary" style={{ fontSize: 12, padding: '5px 11px', minHeight: 32 }}
            onClick={handleScan} disabled={scanState === 'scanning'}>
            <Icon name="refresh-cw" size={12} />Scan now
          </button>
        </div>

        {/* ── Scan result strip ─────────────────────── */}
        {scanState === 'done' && pending.length > 0 &&
          <div className="src-scan-strip">
            <Icon name="sparkles" size={15} style={{ color: 'var(--brand)', flexShrink: 0 }} />
            <span>Scan complete — <strong>{pending.length} new {pending.length === 1 ? 'source' : 'sources'}</strong> found in your inbox.</span>
          </div>
        }

        {/* ── Suggested by Skoolit ──────────────────── */}
        {pending.length > 0 &&
          <div className="sp-group">
            <div className="src-suggest-head">
              <div>
                <div className="src-pulse" />
                <span>Suggested by Skoolit</span>
                <span className="src-badge">{pending.length}</span>
              </div>
              <span style={{ fontSize: 11.5, color: 'var(--fg3)', fontWeight: 500 }}>From your inbox</span>
            </div>
            <div className="sp-list">
              {pending.map((s) =>
                <div key={s.id} className="src-suggest-card">
                  <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                    <div className="src-suggest-icon" style={{ background: CHILD_PALETTE[s.ci].tint, color: CHILD_PALETTE[s.ci].color }}>
                      <Icon name={s.type === 'domain' ? 'globe' : 'user'} size={14} />
                    </div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 13.5, fontWeight: 600, color: 'var(--fg1)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{s.value}</div>
                      <div style={{ fontSize: 12, color: 'var(--fg3)', marginTop: 2, display: 'flex', alignItems: 'center', gap: 6 }}>
                        <span className="sp-cdot" style={{ background: CHILD_PALETTE[s.ci].color, width: 7, height: 7, flexShrink: 0 }} />
                        {s.child} · {s.count} email{s.count !== 1 ? 's' : ''} found
                      </div>
                    </div>
                    <span style={{ fontSize: 11.5, color: 'var(--fg3)', fontWeight: 500, flexShrink: 0 }}>{s.label}</span>
                  </div>
                  <div className="src-suggest-actions">
                    <button className="btn btn-primary" style={{ flex: 1, fontSize: 13, minHeight: 36 }} onClick={() => approveAndAdd(s)}>
                      <Icon name="check" size={13} />Add source
                    </button>
                    <button className="btn btn-secondary" style={{ flex: 1, fontSize: 13, minHeight: 36 }} onClick={() => skipSugg(s.id)}>
                      Skip
                    </button>
                  </div>
                </div>
              )}
            </div>
          </div>
        }

        {/* All-reviewed notice */}
        {pending.length === 0 && nApproved > 0 &&
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '10px 14px', background: 'var(--success-tint)', borderRadius: 'var(--radius-md)', fontSize: 13, color: 'var(--success)', fontWeight: 600 }}>
            <Icon name="check-circle" size={15} />All suggestions reviewed — {nApproved} added to your sources.
          </div>
        }

        {/* ── Monitored Domains ─────────────────────── */}
        <div className="sp-group">
          <div className="sp-group-row">
            <div className="sp-group-title" style={{ marginBottom: 0 }}>Monitored Domains</div>
            <button className="src-add-btn" onClick={() => setSheet('add-domain')}>
              <Icon name="plus" size={13} />Add
            </button>

function OnboardingWizard({ onComplete }) {
  const [step, setStep] = useState(1);
  const [child, setChild] = useState({ name: '', grade: '', school: '', state: '' });
  const [emailAccounts, setEmailAccounts] = useState([]); // max 2
  const [showSecondInbox, setShowSecondInbox] = useState(false);
  const [calAccounts, setCalAccounts] = useState([]); // max 2
  const [showSecondCal, setShowSecondCal] = useState(false);
  const [rules, setRules] = useState(() => Object.fromEntries(EVENT_TYPES.map((et, i) => [i, et.default])));
  const [digestTime, setDigestTime] = useState('7:00 AM');
  const totalSteps = 5;

  const canNext = () => {
    if (step === 1) return child.name.trim() && child.grade && child.school.trim() && child.state.trim();
    if (step === 2) return emailAccounts.filter(Boolean).length >= 1;
    return true;
  };

  const next = () => {
    if (step === totalSteps) {onComplete();return;}
    setStep((s) => s + 1);

function MainApp({ coParent = false, cpSeed = 'confirm', firstLogin = false, initialSubView = 'home', initialSettingsPage = null }) {
  const [subView, setSubView] = useState(initialSubView);
  const [settingsInitPage, setSettingsInitPage] = useState(initialSettingsPage);
  const goToSources = () => { setSettingsInitPage('Monitored senders & domains'); setSubView('settings'); };
  const [filter, setFilter] = useState('all');
  const [handled, setHandled] = useState(new Set());
  const [openItem, setOpenItem] = useState(null);
  const [toast, setToast] = useState(null);

  const handleResolve = useCallback((item) => {
    setHandled((prev) => new Set([...prev, item.id]));
  }, []);

  const handleAdd = useCallback((item) => {
    setHandled((prev) => new Set([...prev, item.id]));
    const prevHandled = handled;
    setToast({
      msg: `Added to calendar`,
      onUndo: () => {
        setHandled((prev) => {
          const next = new Set(prev);
          next.delete(item.id);
          return next;
        });
        setToast(null);
      }
    });
  }, [handled]);

  return (
    <div className="phone">
      <StatusBar />
      <div className="screen">
        <AppHeader filter={filter} setFilter={setFilter} view={subView} />
        {subView === 'home' &&
        <DigestView
          filter={filter}
          onOpen={setOpenItem}
          handled={handled}
          onResolve={handleResolve}
          onAdd={handleAdd}
          toast={toast}
          onUndoToast={() => setToast(null)}
          coParent={coParent}
          firstLogin={firstLogin}
          onGoToSources={goToSources} />

        }
        {subView === 'calendar' && <CalendarView filter={filter} />}
        {subView === 'sources'  && <SourcesView />}
        {subView === 'settings' && <SettingsView seed={cpSeed} coParent={coParent} initialPage={settingsInitPage} />}
        {openItem &&
        <DetailSheet
          item={openItem}
          onClose={() => setOpenItem(null)}
          onResolve={(item) => {handleResolve(item);setOpenItem(null);}} />

        }
      </div>
      <BottomNav view={subView} setView={setSubView} />
    </div>);

}

  .pg-link:hover { color: #1B241F; }
  @keyframes pg-shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-6px); }
    40%, 80% { transform: translateX(6px); }
  }
  .pg-shake { animation: pg-shake .35s ease; }
</style>

<div class="pg-overlay" id="pg-overlay">
  <div class="pg-box">
    <img class="pg-logo" src="assets/logomark.svg" alt="Skoolit" />
    <div class="pg-wordmark">Skoolit</div>
    <div class="pg-tagline">Prototype preview — restricted access</div>

    <!-- State A: password -->
    <div class="pg-card" id="pg-state-pw">
      <div class="pg-heading">Enter access password</div>
      <div class="pg-sub">This prototype is for invited reviewers only.</div>
      <input id="pg-pw" class="pg-field" type="password" placeholder="Password" autocomplete="off" />
      <button class="pg-btn" onclick="pgCheckPw()">Enter prototype</button>
      <div class="pg-error" id="pg-pw-err">Incorrect password. Try again.</div>
      <button class="pg-link" onclick="pgShow('request')">Don't have a password? Request access →</button>
    </div>

    <!-- State B: access request -->
    <div class="pg-card" id="pg-state-req" style="display:none;">
      <div class="pg-heading">Request access</div>
      <div class="pg-sub">Enter your details and we'll follow up with access.</div>
      <input id="pg-name"  class="pg-field" type="text"  placeholder="Your name"  autocomplete="name" />
      <input id="pg-email" class="pg-field" type="email" placeholder="Email address" autocomplete="email" />
      <input id="pg-phone" class="pg-field" type="tel"   placeholder="Phone (optional)" autocomplete="tel" />
      <button class="pg-btn" id="pg-req-btn" onclick="pgRequestAccess()">Request access</button>
      <div class="pg-error"   id="pg-req-err"></div>
      <div class="pg-success" id="pg-req-ok">Thanks — we'll be in touch soon.</div>
      <button class="pg-link" onclick="pgShow('pw')">← Back to password entry</button>
    </div>
  </div>
</div>

<script>
(function () {
  if (sessionStorage.getItem('skoolit_proto') === '1') {
    document.getElementById('pg-overlay').style.display = 'none';
    return;
  }

  var PW_HASH = btoa('skoolit2026');

  function pgShow(state) {
    document.getElementById('pg-state-pw').style.display  = state === 'pw'      ? '' : 'none';
    document.getElementById('pg-state-req').style.display = state === 'request' ? '' : 'none';
  }
  window.pgShow = pgShow;

  window.pgCheckPw = function () {
    var input = document.getElementById('pg-pw');
    var err   = document.getElementById('pg-pw-err');
    if (btoa(input.value) === PW_HASH) {
      sessionStorage.setItem('skoolit_proto', '1');
      document.getElementById('pg-overlay').style.display = 'none';
    } else {
      err.style.display = 'block';
      input.classList.remove('pg-shake');
      void input.offsetWidth;
      input.classList.add('pg-shake');
      input.value = '';
      setTimeout(function () { input.classList.remove('pg-shake'); }, 400);
    }
  };

  window.pgRequestAccess = function () {
    var name  = document.getElementById('pg-name').value.trim();
    var email = document.getElementById('pg-email').value.trim();
    var phone = document.getElementById('pg-phone').value.trim();
    var err   = document.getElementById('pg-req-err');
    var ok    = document.getElementById('pg-req-ok');
    var btn   = document.getElementById('pg-req-btn');

    err.style.display = 'none';
    ok.style.display  = 'none';

    if (!name) { err.textContent = 'Please enter your name.'; err.style.display = 'block'; return; }
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      err.textContent = 'Please enter a valid email address.'; err.style.display = 'block'; return;
    }

    btn.disabled = true; btn.textContent = 'Sending…';

    fetch('/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, email: email, phone: phone, source: 'prototype-gate' })
    })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      if (data.success) {
        ok.style.display = 'block';
        btn.style.display = 'none';
        document.getElementById('pg-name').disabled  = true;
        document.getElementById('pg-email').disabled = true;
        document.getElementById('pg-phone').disabled = true;
      } else {
        throw new Error(data.error || 'Something went wrong.');
      }
    })
    .catch(function (e) {
      err.textContent = e.message; err.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Request access';
    });
  };

  document.getElementById('pg-pw').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') window.pgCheckPw();
  });
})();
</script>
<!-- ── END GATE ─────────────────────────────────────────────────────────── -->
</body>
</html>
