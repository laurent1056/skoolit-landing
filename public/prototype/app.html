<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#eef2f3">
  <title>Skoolit — Parent Command Center</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/skoolit-command-center.css">
</head>
<body>
  <div id="root"></div>
  <script>
    (() => {
      const authKey = "skoolit_proto";
      const embedded = window.parent !== window;

      // The prototype always starts in the guided onboarding flow when no
      // hash was supplied, while preserving explicit deep links.
      if (!window.location.hash) {
        window.history.replaceState(null, "", `${window.location.pathname}#onboarding`);
      }

      let unlocked = false;
      try {
        unlocked = window.sessionStorage.getItem(authKey) === "1";
      } catch (_) {
        unlocked = false;
      }

      // /prototype/ remains the source of truth for the shared password. The
      // app can be embedded by that gate, but a direct URL cannot bypass it.
      if (!embedded && !unlocked) {
        const next = `/prototype/app.html${window.location.hash || "#onboarding"}`;
        window.__skoolitRedirecting = true;
        window.location.replace(`/prototype/?next=${encodeURIComponent(next)}`);
      }
    })();
  </script>
  <script>
    if (!window.__skoolitRedirecting) {
      const script = document.createElement("script");
      script.src = "./assets/skoolit-command-center.js";
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
