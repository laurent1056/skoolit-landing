<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Skoolit">
  <defs>
    <linearGradient id="g-bg" x1="0" y1="0" x2="0" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8CC8EF"/>
      <stop offset="1" stop-color="#74B8E5"/>
    </linearGradient>
    <linearGradient id="g-body" x1="0" y1="40" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE06B"/>
      <stop offset="1" stop-color="#F4B83A"/>
    </linearGradient>
  </defs>

  <!-- Sky blue background -->
  <rect width="128" height="128" rx="28" fill="url(#g-bg)"/>

  <!-- Wheels (drawn first so body + bumper cover the top half) -->
  <ellipse cx="36" cy="106" rx="13" ry="9" fill="#2A2830"/>
  <ellipse cx="92" cy="106" rx="13" ry="9" fill="#2A2830"/>

  <!-- Yellow body -->
  <rect x="16" y="40" width="96" height="60" rx="5" fill="url(#g-body)"/>

  <!-- Charcoal roof (drawn over body top) -->
  <rect x="22" y="18" width="84" height="26" rx="9" fill="#3E3C4C"/>

  <!-- Side mirrors protruding from cab -->
  <rect x="4" y="46" width="14" height="9" rx="2" fill="#3E3C4C"/>
  <rect x="110" y="46" width="14" height="9" rx="2" fill="#3E3C4C"/>

  <!-- Windshield -->
  <rect x="27" y="44" width="74" height="26" rx="4" fill="white" fill-opacity="0.92"/>

  <!-- Red corner lights -->
  <rect x="16" y="44" width="12" height="12" rx="3" fill="#EA3F72"/>
  <rect x="100" y="44" width="12" height="12" rx="3" fill="#EA3F72"/>

  <!-- Headlights -->
  <rect x="22" y="78" width="20" height="12" rx="4" fill="white"/>
  <rect x="86" y="78" width="20" height="12" rx="4" fill="white"/>

  <!-- Grille — 3 blue stripes -->
  <rect x="56" y="76" width="16" height="3.5" rx="1.75" fill="#3076A8"/>
  <rect x="56" y="81.5" width="16" height="3.5" rx="1.75" fill="#3076A8"/>
  <rect x="56" y="87" width="16" height="3.5" rx="1.75" fill="#3076A8"/>

  <!-- White bumper -->
  <rect x="14" y="93" width="100" height="9" rx="4" fill="white"/>
</svg>
