<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EDEADE"/>
      <stop offset="100%" style="stop-color:#E5E0D5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Top accent bar -->
  <rect width="1200" height="6" fill="#5BBAD5"/>

  <!-- Card -->
  <rect x="80" y="100" width="1040" height="430" rx="28" fill="white" opacity="0.85"/>

  <!-- Logo mark circle -->
  <circle cx="160" cy="210" r="42" fill="#5BBAD5"/>
  <text x="160" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="white">S</text>

  <!-- Brand name -->
  <text x="220" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="#1A1A1A" letter-spacing="-1">Skoolit</text>

  <!-- Tagline -->
  <text x="120" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="#1A1A1A" letter-spacing="-1.5">School emails → family calendar.</text>
  <text x="120" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="#1A1A1A" letter-spacing="-1.5">Automatically.</text>

  <!-- Sub text -->
  <text x="120" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#666666">Connect your inbox once. Never miss a deadline again.</text>

  <!-- CTA pill -->
  <rect x="120" y="462" width="260" height="48" rx="24" fill="#5BBAD5"/>
  <text x="250" y="493" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="white">Try free · getskoolit.com</text>
</svg>
