name: Publish Scheduled Pages

on:
  schedule:
    # Runs daily at 9:00 AM UTC. On each publish date in publish-schedule.json,
    # it removes noindex from the relevant pages and adds them to the sitemap.
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Simulate a publish date (YYYY-MM-DD). Leave blank for today.'
        required: false
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run publish script
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python3 scripts/publish.py "${{ github.event.inputs.date }}"
          else
            python3 scripts/publish.py
          fi

      - name: Commit and push if pages were published
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to publish today."
          else
            DATE=$(date +%Y-%m-%d)
            git commit -m "publish: release scheduled pages for ${DATE}"
            git push origin HEAD:main
          fi
